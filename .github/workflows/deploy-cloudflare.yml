name: Deploy Cloudflare
on:
  workflow_dispatch:
    inputs:
      enable_sync:
        description: 'Start HN metadata synchronization (no AI calls)'
        type: boolean
        default: true
      skip_migrations:
        description: 'Skip remote D1 migration checks when the database is already provisioned'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare.yml'
      - 'scripts/cloudflare-deploy.mjs'
permissions:
  contents: read
concurrency:
  group: jevnews-cloudflare-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Cloudflare authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repository Actions secrets, then rerun this workflow.'
            printf '## Cloudflare authorization required\n\nNo Cloudflare resources were created or deployed. Add `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID` under Settings → Secrets and variables → Actions, then rerun this workflow. Do not paste credentials into issues, source code, or chat.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test test/deployment.test.mjs
      - run: npm run test:db
      - run: npm run build
      - run: npm run test:runtime
      - name: Provision, migrate, publish, and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENABLE_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_sync == false && 'false' || 'true' }}
          DEPLOY_SKIP_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_migrations == true && 'true' || 'false' }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/cloudflare-deploy.mjs
